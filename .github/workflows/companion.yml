# Builds the Android companion app (android/) and publishes the APK on the "companion" release,
# which the Tandem site's /tandem-companion.apk link points to.
name: Android companion
on:
  push:
    paths: ['android/**', '.github/workflows/companion.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Signing key: never stored in the repository. If the repository has the secrets
      # COMPANION_KEYSTORE_B64 and COMPANION_KEYSTORE_PASSWORD, that key is used. Otherwise a key
      # is generated here once and kept in the Actions cache, so later builds are signed the same
      # way and install over earlier ones. (If the cache is ever cleared, a new key is made and
      # the app has to be uninstalled once before installing the new build.)
      - name: Restore the signing key
        id: key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/companion.keystore
          key: companion-signing-key-v1
      - name: Prepare the signing key
        env:
          KEY_B64: ${{ secrets.COMPANION_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.COMPANION_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/companion.keystore"
          if [ -n "$KEY_B64" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEY_B64" | base64 -d > "$KS"
            PASS="$KEY_PASSWORD"
          else
            PASS="companion-${{ github.repository_id }}"
            if [ ! -s "$KS" ]; then
              keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias companion \
                -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=Tandem Companion"
            fi
          fi
          echo "::add-mask::$PASS"
          echo "COMPANION_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "COMPANION_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
      - name: Test and build
        run: gradle -p android testReleaseUnitTest assembleRelease --no-daemon --stacktrace
      - name: Collect the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk tandem-companion.apk
          ls -la tandem-companion.apk
          sha256sum tandem-companion.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tandem-companion
          path: tandem-companion.apk
      - name: Publish on the companion release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view companion >/dev/null 2>&1 || gh release create companion --target "$GITHUB_SHA" \
            --title "Tandem Companion (Android)" \
            --notes "Forwards bank SMS and payment-app notifications about money to your own Tandem. Install it from the link in Tandem → Settings → Automatic payment capture. See docs/AUTO_CAPTURE.md."
          gh release upload companion tandem-companion.apk --clobber
